services:
  mysql:
    image: mysql:8.0
    container_name: mnm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-mnm_db}
      MYSQL_USER: ${DB_USERNAME:-mnm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mnm_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # Dùng CMD-SHELL để shell expand biến môi trường
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mnm_mysql_data:
